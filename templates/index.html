
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ctrl + Alt + Eat | Login</title>

<style>
body, html {
    height: 100%;
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
}

* {
    box-sizing: border-box;
}

/* Background Logo */
.bg-img {
    background-image: url("{% static 'images/background.png' %}");

    min-height: 100vh;

    background-position: center;
    background-repeat: no-repeat;

    /* Keeps the entire logo visible */
    background-size: contain;

    position: relative;
}

/* Login Form Container */
.login-container {
    position: absolute;
    right: 5%;
    top: 50%;
    transform: translateY(-50%);

    max-width: 350px;
    width: 90%;

    padding: 25px;

    background-color: rgba(255, 255, 255, 0.95);

    border-radius: 12px;

    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
}

/* Input Fields */
input[type=text],
input[type=password] {
    width: 100%;
    padding: 15px;
    margin: 8px 0 20px 0;

    border: none;
    border-radius: 5px;

    background: #f1f1f1;
}

input[type=text]:focus,
input[type=password]:focus {
    background-color: #ddd;
    outline: none;
}

/* Login Button */
.btn {
    background-color: #2563eb;
    color: white;

    padding: 15px 20px;

    border: none;
    border-radius: 5px;

    cursor: pointer;
    width: 100%;
}

.btn:hover {
    background-color: #1d4ed8;
}

/* Mobile Layout */
@media (max-width: 768px) {
    .login-container {
        position: relative;
        right: auto;
        top: auto;
        transform: none;

        margin: 30px auto;
    }

    .bg-img {
        padding: 30px 10px;
        background-position: center top;
    }
}
</style>

</head>

<body>

<div class="bg-img">

    <form method="post"
          action="{% url 'login' %}"
          class="login-container">

        {% csrf_token %}

        <h1>Login</h1>

        {% if form.errors %}
        <p style="color: red;">
            Invalid username or password.
        </p>
        {% endif %}

        <label for="username">
            <b>Username</b>
        </label>

        <input
            type="text"
            id="username"
            placeholder="Enter Username"
            name="username"
            required
        >

        <label for="password">
            <b>Password</b>
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
            name="password"
            required
        >

        <button type="submit" class="btn">
            Login
        </button>

    </form>

</div>

</body>
</html>
