{% extends "base.html" %}

{% block title %}Recipes{% endblock title %}

{% block content %} 
{% for recipe in recipe_list %}

<div class="card">
    <div class=class="card-header">
        <span class="fw-bold">
            <a href="{{ recipe.get_absolute_url }}">{{ recipe.title }}</a>
        </span> &middot;
        <span class="text-muted">by {{ recipe.owner_id }}</span>
    </div>
    {% if recipe.owner_id.pk == request.user.pk%}
    <div class="card-body">
        {{ recipe.body }}
    </div>

    <div class="card-footer text-center text-muted">
        <a href="{% url 'recipe_edit' recipe.pk %}"">Edit</a>
        <a href="{% url 'recipe_delete' recipe.pk %}"">Delete</a>

    </div>
        {% endif %}
</div>
<br/>
{% endfor %}
{% endblock content %}
