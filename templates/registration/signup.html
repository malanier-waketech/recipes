{% extends "base.html" %}


{% block title %}Sign Up{% endblock title %}

{% block content %}
    <h2>Sign Up</h2>
    <form method="post">
        {% csrf_token %}
        {{ form }}
        <button class="btn btn-success ms-2" type="submit">Sign Up</button>  
    </form>
    {% if form.errors %}    
        <p style="color: red;">Please correct the errors below.</p>
    {% endif %}
{% endblock content %}
